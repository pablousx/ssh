name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION) || {
            printf 'Unable to read VERSION.\n' >&2
            exit 1
          }
          if ! printf '%s\n' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            printf 'VERSION must contain X.Y.Z, got: %s\n' "${version}" >&2
            exit 1
          fi
          tag_name="v${version}"

          if gh release view "${tag_name}" >/dev/null 2>&1; then
            printf 'Release %s already exists; nothing to publish.\n' "${tag_name}"
            exit 0
          fi

          mkdir -p dist/sshwitch dist/installers
          sed "s/__SSHWITCH_RELEASE_VERSION__/${tag_name}/g" install.sh >dist/installers/install.sh
          sed "s/__SSHWITCH_RELEASE_VERSION__/${tag_name}/g" install.ps1 >dist/installers/install.ps1
          cp uninstall.sh uninstall.ps1 dist/installers/

          if grep -qF '__SSHWITCH_RELEASE_VERSION__' dist/installers/install.sh dist/installers/install.ps1; then
            printf 'Unable to embed release version %s in installer assets.\n' "${tag_name}" >&2
            exit 1
          fi
          grep -qF "RELEASE_VERSION='${tag_name}'" dist/installers/install.sh || {
            printf 'POSIX installer asset does not contain release version %s.\n' "${tag_name}" >&2
            exit 1
          }
          grep -qF "\$releaseVersion = \"${tag_name}\"" dist/installers/install.ps1 || {
            printf 'PowerShell installer asset does not contain release version %s.\n' "${tag_name}" >&2
            exit 1
          }

          smoke_home="${RUNNER_TEMP}/sshwitch-installer-smoke"
          mkdir -p "${smoke_home}"
          if installer_output=$(HOME="${smoke_home}" MOCK_UNAME_S=Linux MOCK_CURL_FAILURE=1 \
            PATH="${GITHUB_WORKSPACE}/tests/mocks:${PATH}" sh dist/installers/install.sh 2>&1); then
            printf 'Stamped POSIX installer unexpectedly succeeded during its failure-path smoke test.\n' >&2
            exit 1
          fi
          if ! printf '%s\n' "${installer_output}" | grep -qF "Downloading SSHwitch ${tag_name}"; then
            printf 'Stamped POSIX installer did not select release %s.\n' "${tag_name}" >&2
            exit 1
          fi

          cp -R linux windows providers README.md ROADMAP.md LICENSE SECURITY.md CHANGELOG.md VERSION dist/sshwitch/
          tar -C dist -czf "dist/sshwitch-${tag_name}.tar.gz" sshwitch
          (cd dist && zip -qr "sshwitch-${tag_name}.zip" sshwitch)
          (cd dist && sha256sum "sshwitch-${tag_name}.tar.gz" >"sshwitch-${tag_name}.tar.gz.sha256")
          (cd dist && sha256sum "sshwitch-${tag_name}.zip" >"sshwitch-${tag_name}.zip.sha256")

          if git rev-parse --verify --quiet "refs/tags/${tag_name}" >/dev/null; then
            tagged_commit=$(git rev-list -n 1 "${tag_name}")
            if [ "${tagged_commit}" != "${GITHUB_SHA}" ]; then
              printf 'Tag %s already points to another commit.\n' "${tag_name}" >&2
              exit 1
            fi
          else
            git tag "${tag_name}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag_name}"
          fi

          {
            printf '## Install this release\n\n'
            printf 'Linux, macOS, and WSL:\n\n'
            printf '```sh\n'
            printf 'curl -fsSL https://github.com/%s/releases/download/%s/install.sh | sh\n' \
              "${GITHUB_REPOSITORY}" "${tag_name}"
            printf '```\n\n'
            printf 'Windows PowerShell:\n\n'
            printf '```powershell\n'
            printf 'irm https://github.com/%s/releases/download/%s/install.ps1 | iex\n' \
              "${GITHUB_REPOSITORY}" "${tag_name}"
            printf '```\n\n'
          } >dist/release-notes.md
          release_notes=$(cat dist/release-notes.md) || {
            printf 'Unable to read generated release instructions.\n' >&2
            exit 1
          }

          gh release create "${tag_name}" \
            --verify-tag \
            --generate-notes \
            --notes "${release_notes}" \
            dist/installers/install.sh \
            dist/installers/install.ps1 \
            dist/installers/uninstall.sh \
            dist/installers/uninstall.ps1 \
            "dist/sshwitch-${tag_name}.tar.gz" \
            "dist/sshwitch-${tag_name}.tar.gz.sha256" \
            "dist/sshwitch-${tag_name}.zip" \
            "dist/sshwitch-${tag_name}.zip.sha256"
